name: CI

# Verificación en cada push a main y en cada PR. Refleja los gates que el repo YA define
# (`npm run audit:arch` fue escrito explícitamente para esto) en vez de inventar unos nuevos.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un PR que recibe varios pushes seguidos cancela las corridas viejas: no tiene sentido pagar
# CI por un commit ya superado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates (tokens · typecheck · tests · ciclos · build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # engines: >=22 (Expo SDK 57 pide 22.13+)
          cache: npm

      # `npm ci` dispara el `prepare` de domain/sync-core/design-tokens, que compila su `dist/`
      # (está gitignoreado). Sin ese paso los consumidores no resolverían @cowinance/*.
      - name: Instalar dependencias
        run: npm ci

      # `apps/mobile` NO es workspace de npm a propósito (Expo se rompe con el hoisting), así que
      # tiene su propio package-lock y el `npm ci` de la raíz NO lo instala. Sin este paso, en CI
      # faltan react-native/expo-* y el gate falla dos veces: en el typecheck de móvil y en los
      # tests de móvil que la suite incluye. En local pasaba inadvertido porque el node_modules de
      # mobile ya estaba instalado a mano.
      - name: Instalar dependencias de móvil
        run: npm ci --prefix apps/mobile

      # Gate único del repo: tokens sin deriva + typecheck (domain, sync-core, design-tokens, api,
      # móvil) + la suite completa de Vitest + cero ciclos de dependencia. Bloquea con exit ≠ 0.
      - name: Gates de arquitectura
        run: npm run audit:arch

      # `audit:arch` no cubre la web (tiene su propio toolchain); se verifica acá.
      - name: Typecheck web
        run: npx tsc -p apps/web/tsconfig.json --noEmit

      # Compila todos los workspaces, incluido el build de producción de Next.
      - name: Build
        run: npm run build

      # La matriz de permisos EJERCIDA por HTTP. Va después del build porque levanta el binario.
      # Los tests unitarios prueban la matriz; esto prueba que el interceptor esté cableado y en
      # el orden correcto — sacarlo del array de providers deja los 16 tests en verde y la API
      # abierta. No necesita PostgreSQL: corre sobre PGlite.
      - name: La matriz de permisos se aplica de verdad
        run: npm run verify:permisos

  # Los MISMOS gates, en Windows. No es redundancia: es el único job que corre fuera de Linux.
  #
  # POR QUÉ EXISTE. Todo lo de arriba corre en `ubuntu-latest`, así que el repo no tenía forma de
  # saber si funcionaba en otro lado — y no funcionaba. Al empezar a desarrollar en Windows
  # aparecieron cuatro fallas de golpe, todas invisibles desde acá:
  #
  #   · `LocalFileStorage` comparaba el path resuelto contra '/' hardcodeado. En Windows `resolve()`
  #     devuelve '\', así que RECHAZABA toda clave válida: el módulo de documentos no podía guardar
  #     un solo archivo.
  #   · `tokens:check` fallaba SIEMPRE sobre un árbol recién clonado. Comparaba byte a byte el CSS
  #     generado (LF) contra el del disco (CRLF, porque no había `.gitattributes`). Contenido
  #     idéntico, `git status` limpio, y el gate bloqueando igual.
  #   · `audit-arch.mjs` filtraba la cobertura con rutas POSIX contra claves con barra invertida:
  #     0 de 79 archivos matcheaban y reportaba 0% en vez de 96.77%.
  #   · Los scripts de limpieza usaban `rm -rf`, que en PowerShell no existe.
  #
  # QUÉ NO HABRÍA ATAJADO, para no prometer de más: el orden de build de los workspaces (las apps
  # se compilaban antes que los packages de los que dependen) no lo detecta NINGÚN CI, porque
  # `npm ci` dispara el `prepare` de los packages y deja sus `dist/` listos antes de que corra el
  # build. Solo se ve corriendo `clean` y después `build`, que es lo que nadie hace en CI.
  #
  # Corre el gate completo y no un subconjunto: duplicar "las partes sensibles a la plataforma" se
  # desincroniza con el gate real al primer chequeo nuevo, y la gracia de `audit:arch` es ser el
  # único lugar donde vive esa lista. El runner de Windows es ~2× más lento, de ahí el timeout más
  # holgado.
  gates-windows:
    name: Gates en Windows (portabilidad)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar dependencias de móvil
        run: npm ci --prefix apps/mobile

      - name: Gates de arquitectura
        run: npm run audit:arch

      - name: Typecheck web
        run: npx tsc -p apps/web/tsconfig.json --noEmit

      # El build va acá y no solo en Linux: `nest build` y el de Next resuelven rutas, y es el
      # paso donde un separador mal asumido aparece sin que ningún test lo toque.
      - name: Build
        run: npm run build

  # Aislamiento multi-tenant contra PostgreSQL REAL. No lo cubre ningún otro job: la suite corre
  # sobre PGlite, que conecta como superusuario y SALTEA la RLS — o sea, en dev las políticas se
  # crean pero nunca se ejercen y una fuga cross-tenant recién aparecería en producción.
  verify-tenant-isolation:
    name: Aislamiento multi-tenant (PostgreSQL real)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Mismo stack que producción (PG 17 + PostGIS 3.5): el DDL usa tipos geography.
        image: imresamu/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5434:5432 # mismo puerto que el docker-compose local, así PG_URL no cambia
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # `verify:rls` importa la lista de tablas COMPILADA (apps/api/dist/db/rls.js) para no
      # duplicar la fuente única. En local el dist ya existe de builds anteriores; en CI hay que
      # generarlo. (`verify:pg` compila la API por su cuenta, pero corre después.)
      - name: Compilar la API
        run: npm run build -w @cowinance/api

      # 1) El MOTOR: las políticas aíslan cuando app.tenant_id está bien puesto.
      - name: RLS aísla (rol no privilegiado)
        run: npm run verify:rls

      # 2) El CONTRATO COMPLETO: además, la app FIJA ese tenant en cada request. Levanta la API
      #    real con un rol restringido y ejerce la frontera por HTTP con dos tenants distintos.
      - name: La app sostiene el aislamiento por HTTP
        run: npm run verify:pg

      # 3) La numeración fiscal NO se pisa bajo concurrencia (G4-2). Va acá y no en el gate de
      #    tests porque PGlite es de UNA sola conexión: allá el `FOR UPDATE` nunca llega a
      #    bloquear y la suite pasaría igual si lo borráramos. Solo con PostgreSQL de verdad el
      #    test puede fallar — y sin `FOR UPDATE` falla: 50 emisiones simultáneas dan 37 números.
      - name: El correlativo fiscal no se repite bajo concurrencia
        env:
          PG_TEST_URL: postgres://postgres:postgres@127.0.0.1:5434/postgres
        run: npx vitest run apps/api/src/modules/tax/numbering-concurrency

  # Recorrido real por el navegador (40 specs). Va en un job aparte del de gates para que el
  # feedback rápido no dependa de arrancar Chromium y una API.
  e2e-web:
    name: E2E web (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Solo chromium: es el único project declarado en playwright.config.ts.
      - name: Instalar navegador
        run: npx playwright install --with-deps chromium

      # `e2e:web` compila la API y corre Playwright; el global-setup levanta su propia API con
      # SEED_DEMO=off y una base temporal fuera del repo (ver apps/web/e2e/README.md).
      - name: E2E
        run: npm run e2e:web

      - name: Subir reporte si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # El ensayo de recuperación. Un backup que nunca se restauró no es un backup: este job respalda,
  # DESTRUYE la base y restaura, y después arranca la app contra lo restaurado. Corre en CI y no a
  # mano porque el procedimiento se rompe callado —una migración nueva, un objeto que el dump no
  # cubre— y el momento de enterarse no es durante un incidente.
  verify-backup:
    name: Backup y restore (ensayo completo)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: imresamu/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # `pg_dump`/`pg_restore` se ejecutan DENTRO del contenedor de la base (el script lo busca
      # por imagen), así la versión del cliente coincide siempre con la del servidor — la causa
      # más común de que un restore falle justo cuando hace falta.
      - name: Respaldar, destruir y restaurar
        run: npm run verify:backup
